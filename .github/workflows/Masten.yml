name: create Masten

on:
  workflow_dispatch:
    
jobs:
  defaultAction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      # Install Blender 4.2 LTS from blender.org (skipped if already present, e.g. in a warm act image)
      - name: Install Blender
        run: |
          if command -v blender >/dev/null 2>&1; then
            echo "Blender already installed: $(blender --version | head -1)"
            exit 0
          fi
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq \
            libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libxrender1 \
            libgl1 libxrandr2 libxcursor1 libxinerama1 libsm6
          BLENDER_VERSION=4.2.9
          curl -fsSL "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender
          sudo tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --version
      # install uv (used by `uv run --with` for plain-python scripts)
      - name: install uv
        uses: astral-sh/setup-uv@v6
      # install Python deps into Blender's bundled Python (for bpy scripts that import git/yaml)
      - name: install Python deps for Blender
        run: |
          BLENDER_PY=$(ls /opt/blender/4.2/python/bin/python3.*[0-9])
          if "$BLENDER_PY" -c 'import git, yaml' 2>/dev/null; then
            echo "Python deps already installed in Blender Python"
            exit 0
          fi
          sudo "$BLENDER_PY" -m ensurepip --upgrade
          sudo "$BLENDER_PY" -m pip install gitpython pyyaml
      # export .obj
      - name: export .obj
        run: blender --background --python utilities/scripts/exportOBJ.py -- Masten
      # export .glb
      - name: export .glb
        run: blender --background --python utilities/scripts/exportGLB.py -- Masten
      # render Thumbnails
      - name: Render Thumbnails
        run: blender --background --python utilities/scripts/renderThumbnail.py -- Masten
      # create Readme
      - name: create Readme
        run: uv run --with gitpython --with pyyaml python utilities/scripts/createReadme.py Masten
      # commit changes
      - name: commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git add .
          git commit -m "generated"
          git push
