name: create Readme

on:
  workflow_dispatch:

jobs:
  # creates texured .obj files and creates a release
  defaultAction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      # install uv (used by `uv run --with` to run createReadme.py)
      - name: install uv
        uses: astral-sh/setup-uv@v6
      # create Readme
      - name: create Readme
        run: uv run --with gitpython --with pyyaml python utilities/scripts/createReadme.py --root
      # commit changes
      - name: commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull
          git add .
          git commit -m "generated"
          git push

  
