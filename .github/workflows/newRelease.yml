name: newRelease

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

jobs:
    createModels_default:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v3
        # Install Blender 4.2 LTS from blender.org (skipped if already present, e.g. in a warm act image)
        - name: Install Blender
          run: |
            if command -v blender >/dev/null 2>&1; then
              echo "Blender already installed: $(blender --version | head -1)"
              exit 0
            fi
            sudo -E apt-get update -qq
            sudo -E apt-get install -y -qq \
              libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libxrender1 \
              libgl1 libxrandr2 libxcursor1 libxinerama1 libsm6
            BLENDER_VERSION=4.2.9
            curl -fsSL "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
            sudo mkdir -p /opt/blender
            sudo tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
            sudo ln -sf /opt/blender/blender /usr/local/bin/blender
            blender --version
        # install uv (used by `uv run --with` for plain-python scripts)
        - name: install uv
          uses: astral-sh/setup-uv@v6
        # install Python deps into Blender's bundled Python (for bpy scripts that import git/yaml)
        - name: install Python deps for Blender
          run: |
            BLENDER_PY=$(ls /opt/blender/4.2/python/bin/python3.*[0-9])
            if "$BLENDER_PY" -c 'import git, yaml' 2>/dev/null; then
              echo "Python deps already installed in Blender Python"
              exit 0
            fi
            sudo "$BLENDER_PY" -m ensurepip --upgrade
            sudo "$BLENDER_PY" -m pip install gitpython pyyaml
        # export .obj (all categories except Verkehrszeichen)
        - name: export .obj
          run: blender --background --python utilities/scripts/exportOBJ.py -- --all
        # Verkehrszeichen has its own OBJ pipeline (blank export + retexture)
        - name: export .obj Verkehrszeichen
          run: blender --background --python utilities/scripts/exportOBJ_Verkehrszeichen.py
        # Create individual Sign .obj from blank type .obj
        # (must run before `export .glb` because Verkehrszeichen's GLB step
        # consumes the per-sign .obj fan-out written here)
        - name: retextureBlanks
          run: uv run --with gitpython python utilities/scripts/retextureOBJ_Verkehrszeichen.py
        # export .glb (all categories)
        - name: export .glb
          run: blender --background --python utilities/scripts/exportGLB.py -- --all
        # render Thumbnails (all categories)
        - name: render Thumbnails
          run: blender --background --python utilities/scripts/renderThumbnail.py -- --all
        # create individual + main Readme files
        - name: create Readmes
          run: uv run --with gitpython --with pyyaml python utilities/scripts/createReadme.py --all --root
        # commit changes
        - name: commit changes
          run: |
            git config user.name github-actions
            git config user.email github-actions@github.com
            git pull
            git add .
            git commit -m "generated"
            git push

    createRelease:
        needs: createModels_default
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v3
        # create zip
        - name: Create Zip
          run: zip obj_files.zip -r */obj/
        # Create release
        - name: Create Release
          id: create_release
          uses: actions/create-release@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
            tag_name: ${{ github.ref }}
            release_name: ${{ github.ref }}
            body: |
                Assets für 3D Stadtmodelle als .obj-Dateien bzw. .glb-Dateien
                - siehe .zip archive
            draft: false
            prerelease: false
        # Upload release assets to github
        - name: Upload Release Asset
          id: upload-release-asset 
          uses: actions/upload-release-asset@v1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
            upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
            asset_path: ./obj_files.zip
            asset_name: obj_files.zip
            asset_content_type: application/zip

  
