# Configuration for createReadme.py.
#
# Each entry:
#   <key>:                 short alias, also accepted on the CLI
#     directory:           on-disk top-level directory for the category
#     display_name:        H1 title and link text in the root readme
#     has_glb:             whether the category produces GLB files; if true the
#                          per-category readme gets an extra "3D-Modell" column
#                          linking to the online 3D viewer
#     intro:               markdown inserted between the H1 and the "## Modelle"
#                          table in the per-category readme

Abfallbehaelter:
  directory: Abfallbehaelter
  display_name: Abfallbehaelter
  has_glb: true
  intro: |
    Dieses Verzeichnis enthält Modelle von Abfallbehaeltern, welche in der Hansestadt Rostock im öffentlichen Raum aufgestellt sind.

    ## Grundlage
    Als Grundlage für die zur Verfügung gestellten Modelle dienen **Fotos** und **Produktskizzen/-maße** der jeweiligen Realweltobjekte.

Ampeln:
  directory: Ampeln
  display_name: Ampeln
  has_glb: true
  intro: |
    ## Allgemein
    Dieses Verzeichnis enthält Modelle von Ampeln.

    ## Grundlage
    Als Grundlage für die zur Verfügung gestellten Modelle dienen **Fotos** und **Produktskizzen/-maße** der jeweiligen Realweltobjekte.

Ausleger:
  directory: Beleuchtung_Ausleger
  display_name: Ausleger
  has_glb: true
  intro: |
    Dieses Verzeichnis enthält Modelle von Ausleger. Die nachgestellten Parameter beschreiben Offsets der zugehörigen Lampe relativ zur Hauptachse des Mastes in Millimeter.

    Zugehörige Lampen und Masten können über den Dateinamen identifiziert werden.

    ## Grundlage
    Als Grundlage für die zur Verfügung gestellten Modelle dienen **Fotos** und **Produktskizzen/-maße** der jeweiligen Realweltobjekte.

Lampen:
  directory: Beleuchtung_Lampen
  display_name: Lampen
  has_glb: true
  intro: |
    ## Allgemein
    Dieses Verzeichnis enthält Modelle von Lampenkörpern. Diese entsprechen dem Bauteil ohne Mast oder Ausleger (sofern vorhanden).
    Es werden drei grundsätzliche Typen von Leuchten umgesetzt:
    - Aufsatzleuchte
    - Ansatzleuchte
    - Hängeleuchte

    Zugehörige Masten und Ausleger können über den Dateinamen identifiziert werden.

    ## Grundlage
    Als Grundlage für die zur Verfügung gestellten Modelle dienen **Fotos** und **Produktskizzen/-maße** der jeweiligen Realweltobjekte.

Masten:
  directory: Beleuchtung_Masten
  display_name: Masten
  has_glb: true
  intro: |
    Dieses Verzeichnis enthält Modelle von Masten. Die nachgestellte Zahl im Dateinamen entspricht dabei der Höhe des Mastes in Millimeter.

    Zugehörige Lampen und Ausleger können über den Dateinamen identifiziert werden.

    ## Grundlage
    Als Grundlage für die zur Verfügung gestellten Modelle dienen **Fotos** und **Produktskizzen/-maße** der jeweiligen Realweltobjekte.

